<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="product-detail.css">
    <link rel="stylesheet" href="popup.css">

</head>

<body>


    <!-- NAVBAR -->
<nav class="navbar navbar-expand-lg">
    <div class="container">

        <!-- LOGO -->
        <a class="navbar-brand" href="main.html">
            <img src="img/logo-2.svg" class="about-logo" alt="Logo">
        </a>

        <!-- MOBILE BUTTON -->
        <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav">
            <i class="bi bi-list text-danger"></i>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <!-- MENU -->
            <ul class="navbar-nav mx-auto gap-lg-3 fw-bold">
                <li class="nav-item">
                    <a class="nav-link" href="main.html">HOME</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="about.html">ABOUT US</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="shop.html">SHOP</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="contact.html">CONTACT</a>
                </li>
            </ul>

            <!-- CART -->
            <div class="cart-box">

                <a href="cart.html"
                   class="cart-link d-flex align-items-center gap-2 text-decoration-none">

                    <span id="cartTotal">Cart/₹0.00</span>

                    <i class="bi bi-bag fs-4"></i>

                </a>

                <i class="bi bi-person-fill person-icon fs-5"></i>

                <!-- POPUP -->
                <div class="cart-popup">

                    <div id="popupProducts"></div>

                    <div class="popup-subtotal">
                        <span>Subtotal:</span>
                        <span id="popupSubtotal">₹0.00</span>
                    </div>

                    <a href="cart.html" class="view-cart-btn">
                        VIEW CART
                    </a>

                    <a href="checkout.html" class="checkout-popup-btn">
                        CHECKOUT
                    </a>

                </div>

            </div>

        </div>
    </div>
</nav>


    <!-- PRODUCT DETAIL -->

    <section class="product-detail-page">

        <div class="container">

            <div class="row align-items-start g-5">


                <!-- IMAGE -->

                <div class="col-lg-6">

                    <div class="product-detail-image">

                        <img id="pageProductImage" class="img-fluid" alt="Product">

                    </div>

                </div>



                <!-- DETAILS -->

                <div class="col-lg-6">

                    <p class="text-danger">
                        Uncategorized
                    </p>


                    <h1 id="pageProductName" class="fw-normal">
                    </h1>


                    <h2 id="pageProductPrice" class="fw-bold mt-3">
                    </h2>


                    <p>

                        <strong>
                            Availability:
                        </strong>

                        <span class="text-success">
                            10 in stock
                        </span>

                    </p>


                    <div class="d-flex gap-3 mt-4">

                        <input type="number" value="1" min="1" class="form-control" style="width:60px;">


                        <button id="addToCartBtn" class="add-cart btn btn-danger rounded-pill px-4 fw-bold">
                            ADD TO CART
                        </button>
                    </div>


                    <hr class="my-4">


                    <p>
                        Category:
                        <span class="text-danger">
                            Uncategorized
                        </span>
                    </p>

                </div>

            </div>


            <!-- DESCRIPTION -->

            <div class="mt-5">

                <h5 class="fw-bold">
                    Description
                </h5>

                <p>
                    Premium quality TWS headphones with
                    excellent sound and comfortable design.
                </p>

            </div>

        </div>

    </section>
    <script src="web.js"></script>

    <script>

        let image = localStorage.getItem("productImage");
        let name = localStorage.getItem("productName");
        let price = localStorage.getItem("productPrice");

        document.querySelector("#pageProductImage").src = image;
        document.querySelector("#pageProductName").textContent = name;
        document.querySelector("#pageProductPrice").textContent = price;


    </script>
</body>

</html>
